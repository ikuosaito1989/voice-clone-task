name: Run Kaggle notebook

# 実行は Cloudflare Worker cron から workflow_dispatch で叩かれる。
on:
  workflow_dispatch:
    inputs:
      notebook:
        description: "実行するノートブック"
        type: choice
        default: t4
        options: [t4, main]

# 同時実行を抑止（前回が走っている間は待つ）
concurrency:
  group: run-kaggle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # まず boto3 だけで pending.json を確認。0件なら以降を全てスキップし、
      # kaggle も playwright も入れずに終了する（空実行を最小コストに）。
      - name: Check pending
        id: pending
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install --quiet boto3
          python automation/run_notebook.py \
            "${{ github.event.inputs.notebook || 't4' }}" \
            --check-only --skip-if-empty

      # pending がある時だけ kaggle を入れて、実行中(busy)でないか確認
      - name: Check busy
        id: busy
        if: steps.pending.outputs.should_run == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install --quiet kaggle
          python automation/run_notebook.py \
            "${{ github.event.inputs.notebook || 't4' }}" \
            --check-only --skip-if-busy

      # pending あり & 実行中でない時だけ Playwright で Save & Run All（T4）を実行
      - name: Trigger Save & Run All (UI / T4)
        if: steps.pending.outputs.should_run == 'true' && steps.busy.outputs.should_run == 'true'
        env:
          KAGGLE_STATE_JSON: ${{ secrets.KAGGLE_STATE_JSON }}
          # RUNNING 確認（コミット成功検証）のため Kaggle API 認証も渡す
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HEADLESS: "1"
        run: |
          pip install --quiet kaggle playwright
          python -m playwright install --with-deps chromium
          python automation/trigger_via_ui.py \
            "${{ github.event.inputs.notebook || 't4' }}"

      # 失敗（cookie 失効など）に確実に気づけるよう Slack へ通知
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Kaggle 自動実行が失敗しました（cookie 失効の可能性）。kaggle-state.json を取り直して GitHub Secret の KAGGLE_STATE_JSON を更新してください。\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
