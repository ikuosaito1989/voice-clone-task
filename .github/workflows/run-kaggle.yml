name: Run Kaggle notebook

# 実行は Cloudflare Worker cron から workflow_dispatch で叩かれる。
# GitHub 自身の schedule は高頻度だと発火しないため backstop 扱い。
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      notebook:
        description: "実行するノートブック"
        type: choice
        default: t4
        options: [t4, main]

# 同時実行を抑止（前回が走っている間は待つ）
concurrency:
  group: run-kaggle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 軽い依存だけ先に入れて pending / busy をチェック。
      # 重い chromium 導入は should_run=true のときだけに絞る（空実行を軽くする）。
      - name: Install check deps
        run: pip install --quiet kaggle boto3

      - name: Check pending / busy
        id: check
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python automation/run_notebook.py \
            "${{ github.event.inputs.notebook || 't4' }}" \
            --check-only --skip-if-empty --skip-if-busy

      # 仕事がある時だけ Playwright を用意して、Kaggle UI から Save & Run All（T4）を実行
      - name: Trigger Save & Run All (UI / T4)
        if: steps.check.outputs.should_run == 'true'
        env:
          KAGGLE_STATE_JSON: ${{ secrets.KAGGLE_STATE_JSON }}
          # RUNNING 確認（コミット成功検証）のため Kaggle API 認証も渡す
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HEADLESS: "1"
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python automation/trigger_via_ui.py \
            "${{ github.event.inputs.notebook || 't4' }}"
